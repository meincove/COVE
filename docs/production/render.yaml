services:
  # ---------------------------------------------------
  # 1. DJANGO BACKEND (Main API & Catalog)
  # ---------------------------------------------------
  - type: web
    name: cove-backend
    env: python
    region: frankfurt  # Frankfurt (EU Central) is good for .de domains
    plan: starter
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: cove-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: cove-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*" # Will lock this down later to your domain

  # ---------------------------------------------------
  # 2. COVE AI CORE (FastAPI + Docker)
  # ---------------------------------------------------
  - type: web
    name: cove-ai-core
    env: docker
    region: frankfurt
    plan: starter
    rootDir: cove-ai-core
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cove-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: cove-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false # You will enter this in Render Dashboard manually

databases:
  # ---------------------------------------------------
  # 3. POSTGRES DATABASE (Shared)
  # ---------------------------------------------------
  - name: cove-db
    databaseName: cove
    user: cove_admin
    region: frankfurt
    plan: starter

services:
  # ---------------------------------------------------
  # 4. REDIS (Shared Task Queue)
  # ---------------------------------------------------
  - type: redis
    name: cove-redis
    region: frankfurt
    plan: starter
    ipAllowList: [] # Only internal services can access
